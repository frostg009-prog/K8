# rpi-eeprom-config --apply eeprom.conf
[all]
BOOT_UART=1
POWER_OFF_ON_HALT=1      # halt -> PMIC standby (rails off) so the supervisor can detect "CM5 off"
WAKE_ON_GPIO=0
PSU_MAX_CURRENT=5000     # board supplies 5 A from its own buck, no USB-PD negotiation
BOOT_ORDER=0xf461        # SD -> NVMe -> USB -> repeat (eMMC models boot eMMC first automatically)
